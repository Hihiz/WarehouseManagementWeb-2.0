<body>
  <header>
    <nav class="navbar navbar-expand-sm navbar-toggleable-sm bg-white border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand">Header</a>
        <div class="navbar-collapse collapse d-sm-inline-flex">
          <ul class="navbar-nav flex-grow-1 elem-right-end">
            @if ((userSignIn$ | async)?.accessToken) {
              <li class="nav-item">
                <a class="nav-link text-dark" (click)="onSendLogout()">Logout</a>
              </li>

            } @else if (!(userSignIn$ | async)?.accessToken) {
              <li class="nav-item">
                <a class="nav-link text-dark" routerLink="/signin">Sign In</a>
              </li>

              <li class="nav-item">
                <a class="nav-link text-dark" routerLink="/signup">Sign Up</a>
              </li>
            }
          </ul>
        </div>
      </div>
    </nav>
  </header>
</body>
<router-outlet></router-outlet>
