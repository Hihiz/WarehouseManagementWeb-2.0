name: CI Pipeline (Build & Test)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend-ci:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Restore dependencies
        run: dotnet restore

      - name: 4. Build backend solution
        run: dotnet build --configuration Release --no-restore

      - name: 5. Run Unit and Integration Tests
        run: dotnet test --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: 6. Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() # Выполнять даже если тесты упали
        with:
          name: dotnet-test-results
          path: '**/*test-results.trx'

  frontend-ci:
    name: Angular Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
        
      - name: 3. Install dependencies
        run: npm ci
        working-directory: ./warehouse-management-web-angular

      - name: 4. Build Angular app
        run: npm run build -- --configuration production
        working-directory: ./warehouse-management-web-angular